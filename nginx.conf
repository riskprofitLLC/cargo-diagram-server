# Прод-прокси (задача 6.1): TLS-терминация перед app:8000, /health без авторизации.
worker_processes auto;
events { worker_connections 1024; }

http {
    upstream cargo_app { server app:8000; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # сертификаты монтируются из ./certs (docker-compose.yml); для проверки
        # на чистом VPS — tools/gen-selfsigned.sh, для прода — Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/cargo/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cargo/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 4m;   # согласовано с MAX_BODY_BYTES (app/limits.py)

        location /health {
            proxy_pass http://cargo_app/health;
            access_log off;
        }

        location / {
            proxy_pass http://cargo_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
